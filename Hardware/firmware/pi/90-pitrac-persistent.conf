#
# Installed as /etc/systemd/journald.conf.d/90-pitrac-persistent.conf by
# install.sh. Keeps the journal across power cycles: the Pi's half of the halt
# record (BENCH_P8_PI.md 8.6). Raspberry Pi OS may ship a drop-in that keeps the
# journal in RAM; "90-" sorts after it, so this one wins. Check the result with
#     systemd-analyze cat-config systemd/journald.conf
[Journal]
Storage=persistent
