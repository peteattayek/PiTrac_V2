# OpenOCD config: SWD to the RP2354 from a Raspberry Pi 5, FLYING LEADS.
#
# The Pi is NOT seated on J8. Wire only three signals:
#
#   Pi GPIO24  ->  J8 pin 18   (SWDIO)
#   Pi GPIO25  ->  J8 pin 22   (SWCLK)
#   Pi GND     ->  J8 pin 20 / 25 / 30 / 34 / 39 / 6 / 9 / 14
#
# Because J8.2/4 (+5V) and J8.1/17 (Pi 3V3) stay unconnected, the board never
# powers the Pi. GPIO24 presence-sense reads low and RPI5_ON stays low, so the
# firmware correctly takes its bench branch. That is the whole point: you get a
# real debugger while "no Pi is connected" stays true.
#
# Pi 5 gotchas:
#   * bcm2835gpio does NOT work on the Pi 5 -- the GPIOs are behind the RP1
#     southbridge. linuxgpiod is the driver that works.
#   * The gpiochip number moved between kernels. On Pi 5 the 40-pin header is
#     gpiochip4 on older kernels and gpiochip0 on rpi kernel >= 6.6.47.
#     Run `gpioinfo` and use whichever chip lists GPIO24/GPIO25.
#   * You need an OpenOCD with RP2350 support (target/rp2350.cfg) -- the
#     Raspberry Pi fork, or a sufficiently recent upstream.
#
# Usage:
#   openocd -f openocd_pi5.cfg -c "program pitrac.elf verify reset exit"
#   openocd -f openocd_pi5.cfg           # then: gdb-multiarch -ex 'target extended-remote :3333'

adapter driver linuxgpiod

# <<< CHECK THIS with `gpioinfo` before first use >>>
adapter gpio chip 4

adapter gpio swclk 25
adapter gpio swdio 24

transport select swd

# Bitbanged SWD on the Pi 5 is slow. Start conservative; raise it once it works.
# If this fights you, a Raspberry Pi Debug Probe removes the entire problem
# class for about $12 -- worth it given how many flash cycles phases 2-6 take.
adapter speed 1000

source [find target/rp2350.cfg]

# RP2354B is single-core-relevant for our purposes; core 0 is the one we debug.
# (rp2350.cfg exposes both; select explicitly if gdb attaches to the wrong one.)
